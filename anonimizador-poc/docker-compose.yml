# Nenhum servico que processa documento tem saida de rede.
#
# Isso nao e conveniencia: e a prova executavel da restricao de soberania. Se
# alguma etapa tentar falar com um servico externo, ela falha em vez de vazar
# conteudo de documento.
#
# Ha duas formas de garantir isso aqui, e a diferenca importa:
#
#   * `network_mode: none` — sem interface de rede nenhuma. Usado por todo
#     servico de linha de comando. Garantia maxima, mas nao publica porta.
#
#   * rede `interna` (`internal: true`) — tem interface, alcanca outros
#     containers da mesma rede, nao alcanca o mundo. Usado pelo servico `ui`,
#     que precisa ser alcancavel. O egress continua bloqueado pelo kernel,
#     subprocesso incluido (medido; ver src/anonimizador/web/forward.py).
#
# Exatamente DOIS containers tem saida de rede, e os dois sao pequenos de
# proposito — quem tem rede nao tem arvore de dependencias:
#
#   * `ui-proxy`  copia bytes entre a porta publicada e o `ui`. Nao interpreta
#                 HTTP, nao le PDF, nao importa nada alem da biblioteca padrao.
#
#   * `analise`   manda o texto ja pseudonimizado e ja verificado ao OpenRouter.
#                 Nao monta ./out, entao nao alcanca o documento original.
#
# O `postgres` NAO e um terceiro: ele fica na rede `interna`, sem rota para
# fora. Guarda identidade e trilha, nunca documento — ver goal-fase-4.md §1.

# Configuracao da imagem, sem politica de rede.
x-imagem: &imagem
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: anonimizador-poc:fase0
  volumes:
    - ./src:/app/src:ro
    - ./eval:/app/eval
    - ./tests:/app/tests:ro
    - ./data:/app/data
    - ./out:/app/out
  working_dir: /app

# Imagem + ausencia total de rede. Padrao para tudo que roda em lote.
x-base: &base
  <<: *imagem
  network_mode: none

networks:
  # Sem rota para fora. Containers aqui se enxergam e nada mais.
  interna:
    internal: true
  # So o encaminhador vive aqui.
  externa: {}

services:
  # Shell interativo para desenvolvimento.
  dev:
    <<: *base
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true

  # Testes unitarios.
  test:
    <<: *base
    entrypoint: ["python", "-m", "pytest"]
    command: ["-q"]

  # Gera o corpus sintetico (PDFs + gabarito).
  corpus:
    <<: *base
    command: ["corpus", "--out", "/app/eval/datasets", "--n", "50"]

  # Roda a avaliacao completa nas 3 configuracoes de NER.
  eval:
    <<: *base
    command: ["eval", "--datasets", "/app/eval/datasets", "--report", "/app/eval/report.md"]

  # Prova de offline: pipeline ponta a ponta, sem interface de rede.
  offline-proof:
    <<: *base
    command: ["offline-proof"]

  # Diagnostico dos vazamentos de PERSON: falta de deteccao ou rotulo errado.
  # Entrypoint sobrescrito porque o script vive em eval/, fora da CLI.
  diagnostico:
    <<: *base
    entrypoint: ["python", "/app/eval/diagnostico_person.py"]
    command: ["--datasets", "/app/eval/datasets", "--out", "/app/eval/diagnostico-person.md"]

  # Gate de usabilidade: monta a sessao com pessoas. Nao mede nada sozinho —
  # colhe documentos em que o modelo real deixa um nome sem tarja, guarda o
  # gabarito e apura o registro depois. Ver eval/gate-usabilidade-roteiro.md.
  gate-usabilidade:
    <<: *base
    entrypoint: ["python", "/app/eval/gate_usabilidade.py"]
    command: ["--preparar", "--out", "/app/eval/gate-usabilidade"]

  # --------------------------------------------------------------------
  # Interface de revisao
  # --------------------------------------------------------------------
  # Faz TODO o trabalho: deteccao, redacao, verificacao, render de pagina.
  # Fica na rede interna, sem egress. Nao publica porta — e inalcancavel do
  # host de proposito; quem a alcanca e o `ui-proxy`.

  # Identidade, inquilino e trilha. NUNCA documento — ver goal-fase-4.md §1.
  #
  # Fica na rede `interna`, como o `ui`: sem rota para fora. E isso e o que
  # mantem `make ui-proof` valendo sem alteracao. Um banco gerenciado na nuvem
  # exigiria que o `ui` alcancasse a rede, e a garantia mudaria de "nao existe
  # interface de rede" para "existe rota so para o banco" — mais fraca, e
  # decisao consciente quando chegar a hora.
  postgres:
    image: postgres:17-alpine
    networks: [interna]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-anonimizador}"
      POSTGRES_USER: "${POSTGRES_USER:-anonimizador}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anonimizador}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ui:
    <<: *imagem
    networks: [interna]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["anonimizador.web.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ANON_NER: "${ANON_NER:-bert-lenerbr}"
      ANON_ANALISE_URL: "http://analise:8100"
      ANON_DB_URL: "postgresql+pg8000://${POSTGRES_USER:-anonimizador}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-anonimizador}"
    expose: ["8000"]

  # Analise por LLM externa. A SEGUNDA peca com saida de rede, e a unica que
  # faz conteudo sair da maquina.
  #
  # Nao usa `*imagem`: aquele bloco monta ./out, que e onde os originais em
  # claro vivem durante a revisao. Aqui o mount e so ./src, e so leitura. O
  # servico recebe o texto ja pseudonimizado e ja verificado pelo `ui`, e nao
  # tem como alcancar o documento de origem nem que queira.
  #
  # A chave do OpenRouter vive AQUI e so aqui: o componente que guarda a
  # credencial e o pequeno, nao o que carrega torch e transformers.
  analise:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: anonimizador-poc:fase0
    working_dir: /app
    volumes:
      - ./src:/app/src:ro
    # Defesa em profundidade sobre o `.dockerignore`: mesmo que um build futuro
    # volte a assar ./out na imagem, este tmpfs cobre o caminho com um sistema
    # de arquivos vazio e em memoria. O servico com egress nao alcanca
    # documento em claro por nenhum dos dois caminhos.
    tmpfs:
      - /app/out
      - /app/data
    networks: [interna, externa]
    entrypoint: ["python", "-m", "anonimizador.web.analise"]
    command: ["--escuta", "0.0.0.0:8100"]
    environment:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.5}"
      ANON_ANALISE_MAX_CHARS: "${ANON_ANALISE_MAX_CHARS:-200000}"
    expose: ["8100"]

  # Encaminhador TCP. Tem saida de rede, mas nao processa documento: copia
  # bytes entre sockets. Publicado so em 127.0.0.1 — nao escuta em interface
  # externa da maquina.
  ui-proxy:
    <<: *imagem
    networks: [interna, externa]
    depends_on: [ui]
    entrypoint: ["python", "-m", "anonimizador.web.forward"]
    command: ["--escuta", "0.0.0.0:8000", "--destino", "ui:8000"]
    ports:
      - "127.0.0.1:8000:8000"

  # CLI livre: docker compose run --rm cli redact --in ... --out ...
  cli:
    <<: *base

  # Migracoes do banco de identidade.
  #
  #   docker compose run --rm cli-db upgrade head
  #   docker compose run --rm cli-db revision --autogenerate -m "descricao"
  #
  # Rede `interna` para alcancar o `postgres`, e so ele. Monta ./migracoes
  # gravavel porque `--autogenerate` escreve arquivo novo.
  cli-db:
    <<: *imagem
    networks: [interna]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./migracoes:/app/migracoes
      - ./alembic.ini:/app/alembic.ini:ro
    entrypoint: ["alembic", "-c", "/app/alembic.ini"]
    environment:
      ANON_DB_URL: "postgresql+pg8000://${POSTGRES_USER:-anonimizador}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-anonimizador}"

# Volume nomeado para o banco. Nomeado e nao bind mount de proposito: o
# conteudo e do Postgres, nao do projeto, e nao deve aparecer na pasta que o
# `COPY . /app` do Dockerfile enxerga.
volumes:
  pgdata:
