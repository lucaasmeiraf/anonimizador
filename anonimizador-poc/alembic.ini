# Migracoes versionadas do banco de identidade.
#
# Por que Alembic e nao `Base.metadata.create_all` na subida: esquema que muda
# sem historico e o que impede atualizar a instalacao de um cliente. Com
# migracao versionada, a atualizacao e `alembic upgrade head`; sem ela, e um
# dump, um script manual e torcida.
#
#   docker compose run --rm cli-db upgrade head
#   docker compose run --rm cli-db revision --autogenerate -m "descricao"

[alembic]
script_location = /app/migracoes
prepend_sys_path = /app/src
# A URL vem de ANON_DB_URL, em migracoes/env.py. Nao fica aqui: este arquivo e
# versionado e a URL carrega a senha.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
